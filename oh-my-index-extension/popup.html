<button id="save">Save Tabs</button>

<!-- 弹窗（自动出现自动消失） -->
<div class="toast" id="toast"></div>

<script src="popup.js"></script>



<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 220px;
    padding: 24px 20px;
    background-color: #f8f5eb;
  }

  #save {
    width: 100%;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 600;
    background-color: #73b8e8;
    color: #f9d342;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  #save:hover {
    background-color: #5fa8d8;
    transform: translateY(-2px);
  }

  /* 弹窗 */
  .toast {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    background: #73b8e8;
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);

    /* 默认消失 + 透明 */
    display: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  /* 只控制透明度动画 */
  .toast.show {
    opacity: 1;
  }
</style>
